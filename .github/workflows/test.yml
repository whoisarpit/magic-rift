name: Test Cross-Platform

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pytest

      - name: Run tests
        run: |
          uv run pytest tests/ -v

      - name: Test basic import
        run: |
          uv run python -c "import rift; print('Import successful')"

      - name: Test CLI help
        run: |
          uv run rift --version
          uv run rift --help
          uv run rift share --help

      - name: Check code formatting (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uvx ruff check rift.py

      - name: Report platform info
        run: |
          uv run python -c "import sys, platform; print(f'Python: {sys.version}'); print(f'Platform: {platform.platform()}')"
