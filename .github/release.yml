changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
      - chore
      - ci
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
        - bugfix
    - title: Security
      labels:
        - security
    - title: Performance
      labels:
        - performance
    - title: Documentation
      labels:
        - docs
    - title: Internal
      labels:
        - refactor
        - test
    - title: Other
      labels:
        - "*"

template: |
  ## What Changed
  $CHANGES

  ## Full Changelog
  $FULL_CHANGELOG
