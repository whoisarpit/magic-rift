<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .light-mode {
      display: none;
    }

    @media (prefers-color-scheme: light) {
      .dark-mode {
        display: none;
      }

      .light-mode {
        display: inline;
      }
    }
  </style>
  <defs>
    <linearGradient id="lineShadowDark" x1="32" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09f" stop-opacity="0.55" />
      <stop offset="0.08" stop-color="#09f" stop-opacity="0.28" />
      <stop offset="1" stop-color="#09f" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lineShadowLight" x1="32" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09f" stop-opacity="0.55" />
      <stop offset="0.08" stop-color="#09f" stop-opacity="0.28" />
      <stop offset="1" stop-color="#09f" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g class="dark-mode">
    <rect x="32" y="12" width="16" height="40" fill="url(#lineShadowDark)" />
    <line x1="8" y1="32" x2="24" y2="32" stroke="white" stroke-width="3" />
    <path d="M22 24 L32 32 L22 40 Z" fill="white" />
  </g>
  <g class="light-mode">
    <rect x="32" y="12" width="16" height="40" fill="url(#lineShadowLight)" />
